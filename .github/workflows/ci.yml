name: CI
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
  push:
    branches:
      - "*"
jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run Unit Tests
        run: |
          set -euo pipefail
          java -version
          mvn -version
          mvn --batch-mode --no-transfer-progress clean verify
          
