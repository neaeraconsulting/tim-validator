trigger:
  branches:
    include:
      - '*'

pr:
  branches:
    include:
      - '*'

variables:
  - name: VersionNum
    value: '0.0.0-SNAPSHOT'  # initial value.  'Get version number' step will read the actual value from pom
  - name: WorkingDir
    value: '$(system.defaultWorkingDirectory)/timvalidator'
  - name: JavaHome
    value: 'JavaHome' # initial value, JDK install step sets it
  - name: DOCKERHUB_NAMESPACE
    value: neaeraconsulting
  - name: imageRepository
    value: timvalidator-api
  - name: dockerfilePath
    value: $(Build.SourcesDirectory)/Dockerfile
  - name: imageName
    value: $(DOCKERHUB_NAMESPACE)/$(imageRepository)


stages:
  - stage: CI
    displayName: Build and Test
    jobs:
      - job: BuildAndTest
        displayName: Compile, test, and check coverage
        pool:
          vmImage: ubuntu-24.04
        container: maven:3.9.11-eclipse-temurin-25
        variables:
          MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
          MAVEN_OPTS: '-Dmaven.repo.local=$(Pipeline.Workspace)/.m2/repository'
        steps:
          - checkout: self
            displayName: Checkout

          - task: Cache@2
            displayName: Cache Maven repository
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(MAVEN_CACHE_FOLDER)

          - task: UseDotNet@2
            displayName: Install .NET SDK for coverage publisher
            inputs:
              version: '8.x'

          - bash: |
              set -euo pipefail
              java -version
              mvn -version
              mvn --batch-mode --no-transfer-progress clean verify
            displayName: Compile, test, and check coverage

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/target/surefire-reports/TEST-*.xml'
              mergeTestResults: true
              failTaskOnMissingResultsFile: true

          - task: PublishCodeCoverageResults@2
            displayName: Publish JaCoCo coverage
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/timvalidator/target/site/jacoco/jacoco.xml'
              pathToSources: '$(System.DefaultWorkingDirectory)/timvalidator/src/main/java'
              failIfCoverageEmpty: true
            env:
              DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'


  - stage: Docker
    displayName: Build and publish image
    dependsOn: CI
    condition: |
      and(
        succeeded(),
        in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/develop')
      )
    jobs:
      - job: BuildAndPush
        displayName: Build and push to Docker Hub
        pool:
          vmImage: ubuntu-latest
        steps:
          - bash: |
              set -euo pipefail
              branch="$(Build.SourceBranchName)"
              sha="$(Build.SourceVersion)"
              short_sha="${sha:0:12}"
              tags="${short_sha},${branch}"
              if [ "$branch" = "main" ]; then
                tags="${tags},latest"
              fi
              echo "Publishing $(imageName) with tags: ${tags}"
              echo "##vso[task.setvariable variable=dockerTags]${tags}"
            displayName: Compute image tags

          - bash: |
              set -euo pipefail
              echo "$DOCKERHUB_PAT" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            displayName: Login to Docker Hub
            env:
              DOCKERHUB_USERNAME: $(DOCKERHUB_USERNAME)
              DOCKERHUB_PAT: $(DOCKERHUB_PAT)

          - bash: |
              set -euo pipefail
              image="$(imageName)"
              IFS=',' read -ra tags <<< "$(dockerTags)"
              tag_args=()
              for tag in "${tags[@]}"; do
                tag_args+=(-t "${image}:${tag}")
              done
              docker build "${tag_args[@]}" -f "$(dockerfilePath)" "$(Build.SourcesDirectory)"
              docker push --all-tags "$image"
            displayName: Build and push image

          - bash: docker logout
            displayName: Logout of Docker Hub
            condition: always()

