spring.application.name=timvalidator-api
server.port=8080
timvalidator.roadway-heading.enabled-by-default=false
# Overpass is shared, rate-limited public infrastructure. Read the usage guidelines before
# deploying, especially for production or commercial use (self-hosted or paid instances are
# recommended there): https://wiki.openstreetmap.org/wiki/Overpass_API#Rules_of_usage
# Overpass API endpoint queried for roadway geometry when roadway heading validation is enabled
timvalidator.roadway-heading.overpass-url=https://overpass-api.de/api/interpreter
# User-Agent sent with Overpass requests; override with a value that uniquely identifies this
# deployment, per the usage guidelines linked above
timvalidator.roadway-heading.overpass-user-agent=timvalidator-api/1.0
