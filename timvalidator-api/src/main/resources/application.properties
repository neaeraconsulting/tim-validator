spring.application.name=timvalidator-api
server.port=8080

# Road geometry used by the heading-slice best-practice check.
# Override the URL with an internally hosted Overpass instance for production-scale traffic.
timvalidator.road-geometry.enabled=true
timvalidator.road-geometry.overpass-url=https://overpass-api.de/api/interpreter
# Keep the Overpass execution budget small, while allowing time for the public service's queue.
timvalidator.road-geometry.query-timeout=5s
timvalidator.road-geometry.http-timeout=20s
timvalidator.road-geometry.search-radius-meters=30
# Keep roads close to the nearest match so unrelated nearby roads are not intersection candidates.
timvalidator.road-geometry.candidate-distance-tolerance-meters=8
timvalidator.road-geometry.user-agent=timvalidator-api/1.0
